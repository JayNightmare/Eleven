<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0"
		/>
		<title>Stick RPG - Voice Edition</title>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			body {
				width: 100%;
				height: 100vh;
				display: flex;
				justify-content: center;
				align-items: center;
				background-color: #1a1a1a;
				font-family: Arial, sans-serif;
				overflow: hidden;
			}

			#game-container {
				width: 100%;
				height: 100%;
				display: flex;
				justify-content: center;
				align-items: center;
			}

			canvas {
				image-rendering: -webkit-optimize-contrast;
				image-rendering: pixelated;
			}
		</style>
	</head>
	<body>
		<div id="game-container"></div>
		<script type="module" src="/src/main.js"></script>
	</body>
</html>
